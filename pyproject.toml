[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waldofinder"
version = "0.1.0"
description = "Data preparation for detecting Waldo in high-resolution scenes"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
waldo-validate = "waldofinder.cli:validate_main"
waldo-visualize = "waldofinder.cli:visualize_main"
waldo-inspect = "waldofinder.compute:main"
waldo-review = "waldofinder.review_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
